{% extends "base.html" %}
{% block content %}
<div class="bar">
  <h2>Plots</h2>
  <div class="seg">{% for a in alts %}<a class="{{ 'on' if alt == a }}" href="?alt={{ a }}">{{ a }} km</a>{% endfor %}</div>
</div>
<div class="grid wide">
  {% for title, img in imgs %}
  <div class="box"><h3>{{ title }}</h3><img src="data:image/png;base64,{{ img }}" alt="{{ title }}"></div>
  {% endfor %}
</div>
{% endblock %}
